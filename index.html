<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active State Detector</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #status {
      text-align: center;
      font-size: 24px;
    }

    #indicator {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: red;
      margin: 0 auto 15px;
    }
  </style>
</head>

<body>

  <div id="status">
    <div id="indicator"></div>
    <div id="state">INACTIVE</div>
    <small id="detail">Tab tidak aktif</small>
  </div>

<script>
  const stateText = document.getElementById("state");
  const detailText = document.getElementById("detail");
  const indicator = document.getElementById("indicator");

  let windowFocused = document.hasFocus();

  // --------------------------------
  // Deteksi Window Focus
  // --------------------------------

  window.addEventListener("focus", () => {
    windowFocused = true;
    updateState();
  });

  window.addEventListener("blur", () => {
    windowFocused = false;
    updateState();
  });


  // --------------------------------
  // Page Visibility API
  // --------------------------------

  document.addEventListener("visibilitychange", () => {
    updateState();
  });


  // --------------------------------
  // Status Active State
  // --------------------------------

  function updateState() {

    const pageVisible =
      document.visibilityState === "visible";

    const active =
      pageVisible && windowFocused;

    if (active) {

      stateText.textContent = "ACTIVE";

      detailText.textContent =
        "Tab terlihat dan sedang fokus";

      indicator.style.background = "lime";

    } else {

      stateText.textContent = "INACTIVE";

      if (!pageVisible) {
        detailText.textContent =
          "Tab sedang tidak terlihat";
      } else {
        detailText.textContent =
          "Tab terlihat tetapi tidak fokus";
      }

      indicator.style.background = "red";
    }

    console.log({
      active,
      visibilityState: document.visibilityState,
      windowFocused
    });
  }


  // --------------------------------
  // Fullscreen API
  // --------------------------------

  async function enterFullscreen() {

    try {

      if (!document.fullscreenElement) {

        await document.documentElement.requestFullscreen();

        console.log("Fullscreen aktif");

      }

    } catch (error) {

      console.error(
        "Gagal masuk fullscreen:",
        error
      );

    }
  }


  // --------------------------------
  // Ketuk layar -> Fullscreen
  // --------------------------------

  document.addEventListener(
    "pointerup",
    enterFullscreen,
    { once: true }
  );


  // --------------------------------
  // Deteksi perubahan Fullscreen
  // --------------------------------

  document.addEventListener(
    "fullscreenchange",
    () => {

      if (document.fullscreenElement) {

        console.log("STATUS: FULLSCREEN");

      } else {

        console.log("STATUS: NORMAL SCREEN");

      }

    }
  );


  // Jalankan pertama kali
  updateState();

</script>

</body>
</html>
